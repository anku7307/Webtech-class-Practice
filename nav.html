<html>
<head>
<title>nav</title>
<style>
#nav{
height:50px;
width:600px;
border:1px solid white;
border-radius:2px;
}
#nav ul{
list-style-type:none;
}
#nav ul li{
display:inline;
background-color:green;
padding:10px;
border:1px solid black;

}
#nav ul li a{
text-decoration:none;
color:white;
}

</style>
</head>
<body>
<div id="nav">
<ul>
<li><a href="#">Home</li>
<li><a href="#">About Us</a></li>
<li><a href="#">Products</a></li>
<li><a href="#">News</a></li>
<li><a href="#">Company</a></li>
</ul>
</div>
</body>
</html>
