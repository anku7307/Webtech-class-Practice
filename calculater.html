<html>
<head>
<title>Calculator</title>
<style>
.outer{
height:800px;
width:800px;
border:1px solid transparent;
background-color:skyblue;
margin:0px auto;
}
.mainpage{
height:600px;
width:400px;
background-color:black;
border:1px solid transparent;
margin:0px auto;
margin-top:100px;
}
.main1{
height:100px;
width:100%;
background-color:black;
color:white;
text-align:right;
line-height:150px;
}
.main2{
height:500px;
width:100%;
background-color:pink;
}
.row1{
height:100px;
width:100%;
background-color:black;
text-align:center;
color:white;
}
.col{
height:90px;
width:90px;
background-color:gray;
border-radius:120px 120px 120px 120px;
float:left;
margin:5px 5px;
}
.col3{
height:90px;
width:90px;
background-color:orange;
border-radius:120px 120px 120px 120px;
float:left;
margin:5px 5px;
}
.col4{
height:90px;
width:90px;
background-color:lightgray;
border-radius:120px 120px 120px 120px;
float:left;
margin:5px 5px;
color:black;
}


.col2{
height;90px;
width:190px;
background-color:gray;
border-radius:50px;
float:left;
margin:5px 5px;
}


</style>
</head>
<body>
<div class="outer">
<div class="mainpage">
<div class="main1"><h1>2+2</h1></div>
<div class="main2">
<div class="row1">
<div class="col4"><h1>AC</h1></div>
<div class="col4"><h1>DEL</h1></div>
<div class="col4"><h1>%</h1></div>
<div class="col3"><h1>/<h1></div>

</div>
<div class="row1">
<div class="col"><h1>7</h1></div>
<div class="col"><h1>8</h1></div>
<div class="col"><h1>9</h1></div>
<div class="col3"><h1>*</h1></div>
</div>
<div class="row1">
<div class="col"><h1>4</h1></div>
<div class="col"><h1>5</h1></div>
<div class="col"><h1>6</h1></div>
<div class="col3"><h1>-</h1></div>
</div>
<div class="row1">
<div class="col"><h1>1</h1></div>
<div class="col"><h1>2</h1></div>
<div class="col"><h1>3</h1></div>
<div class="col3"><h1>+</h1></div>
</div>
<div class="row1">
<div class="col2"><h1>0</h1></div>
<div class="col"><h1>.</h1></div>
<div class="col3"><h1>=</h1></div>
</div>

</div>
</div>
</div>
</div>
</body>
</html>
