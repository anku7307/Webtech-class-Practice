
<html>
    <head>
        <title>Doraemon</title>
    <style>

.Doraemon{
    height:1000px;
    width:1000px;
    background-color: rgb(242, 249, 249);
    border:1px solid transparent;
    margin:0px auto;
}

.face{
    margin-left:300px;
    height:400px;
    width:400px;
    background-color:skyblue;
    border-radius:100%;
    margin-bottom:100px;
    position:absolute;
    border:1px solid black;

}
.miniface{
    height:350px;
    width:350px;
    background-color:white;
    margin-left:25px;
    margin-top:55px;
    border-radius:100%;
    border:1px solid black;

}
.eye{
    width:60px;
    height:80px;
    background:white;
    border:3px solid #000;
    border-radius:50%;
    position:absolute;
    top:40px;
    border:1px solid black;
}
.eye.left{ left:138px; }
.eye.right{ right:135px; }
.dot{
    width:18px;
    height:18px;
    background:black;
    border-radius:50%;
    position:absolute;
    bottom:5px;
    left:20px;
}
.nose{
    height:70px;
    width:50px;
    background-color:red;
    border-radius:90%;
    position:absolute;
    bottom:-60px;
    left:-29px;
    border:1px solid black;
}
.noseline{
    height:83px;
    width:5px;
    background-color: black;
    position:absolute;
    margin-top:138px;
    margin-left:-3px;
}
.mouth{
    width:190px;
    height:80px;
    background-color:rgb(255, 2, 2);
    border-radius:0 0 395px 395px;
    position:absolute;
    top:220px;
    left:-95px;
    border:1px solid black;
}

.body{
    height:400px;
    width:350px;
    background-color:skyblue;
    margin-left:30px;
    margin-top:-10px;
    border-radius:190px 190px 10px 10px;
    border:1px solid black;
}
.belly{
    height:270px;
    width:290px;
    background-color:white;
    margin-left:32px;
    margin-top:40px;
    border-radius:70%;
    border:1px solid black;
}
.bell{
    height:40px;
    width:60px;
    background-color:yellow;
    margin:auto;
    border:1px solid black;
    border-radius:69%;
    margin-top:-12px;
}
.innerbelly{
    height:120px;
    width:210px;
    background-color:white;
    margin:auto;
    border:2px solid black;
    border-radius:0px 0px 90px 90px ;
    margin-top:80px;

}
.hand1{
    height:60px;
    width:150px;
    background-color:skyblue;
    margin-left:-88px;
    margin-top:-270px;
    border-radius:70%;

}
.hand2{
    height:60px;
    width:150px;
    background-color:skyblue;
    margin-left:355px;
    margin-top:-50px;
    border-radius:70%;
}
.palm1{
    height:60px;
    width:60px;
    background-color:white;
    margin-left:-140px;
    margin-top:-70px;
    border-radius:100%;
    border: 1px solid black;
}
.palm2{
    height:60px;
    width:60px;
    background-color:white;
    margin-left:493px;
    margin-top:-55px;
    border-radius:100%;
    border: 1px solid black;
}
.leg1{
    height:70px;
    width:110px;
    border:1px solid black;
    background-color:white;
    margin-left:50px;
    margin-top:200px;
    border-radius:70px 50px 40px 25px;
}
.leg2{
    height:70px;
    width:110px;
    border:1px solid black;
    background-color:white;
    margin-left:250px;
    margin-top:-72px;
    border-radius:50px 70px 25px 40px;
}
</style>
</head>
<body>
    <div class="Doraemon">
        <div class="face">
                <div class="miniface">
                <div class="eye left">
            <div class="dot"></div>
        </div>

        <div class="eye right">
            <div class="dot"></div>
            <div class="mouth"></div>
            <div class="nose">
               
            </div>
            <div class="noseline"></div>

        </div>
             </div>
                <div class="body">
                    <div class="belly">
                        <div class="bell"></div>
                        <div class="innerbelly"></div>
                    </div></div>
                    <div class="hand1"></div>
                    <div class="hand2"></div>
                    <div class="palm1"></div>
                    <div class="palm2"></div>
                    <div class="leg1"></div>
                    <div class="leg2"></div>




        </div>


</body>

    </style>
</html>
